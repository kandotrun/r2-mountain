name: R2Mountain
options:
  bundleIdPrefix: run.kan
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ja
packages:
  MountainCore:
    path: Packages/MountainCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: UGNVGWZMAU
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    GENERATE_INFOPLIST_FILE: YES
targets:
  R2Mountain:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    dependencies:
      - package: MountainCore
      - target: R2MountainFileProvider
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: R2 Mountain
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMultipleInstancesProhibited: true
        R2MountainAppGroup: $(TeamIdentifierPrefix)run.kan.s3mountain
        R2MountainKeychainGroup: $(AppIdentifierPrefix)run.kan.s3mountain.shared
    entitlements:
      path: App/R2Mountain.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)run.kan.s3mountain
        keychain-access-groups:
          - $(AppIdentifierPrefix)run.kan.s3mountain.shared
        com.apple.developer.fileprovider.testing-mode: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.kan.s3mountain
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: R2 Mountain
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
  R2MountainFileProvider:
    type: app-extension
    platform: macOS
    sources:
      - FileProvider
      - Shared
    dependencies:
      - package: MountainCore
    info:
      path: FileProvider/Info.plist
      properties:
        CFBundleDisplayName: R2 Mountain
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        R2MountainAppGroup: $(TeamIdentifierPrefix)run.kan.s3mountain
        R2MountainKeychainGroup: $(AppIdentifierPrefix)run.kan.s3mountain.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderDocumentGroup: $(TeamIdentifierPrefix)run.kan.s3mountain
          NSFileProviderUserInteractions: []
    entitlements:
      path: FileProvider/FileProvider.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)run.kan.s3mountain
        keychain-access-groups:
          - $(AppIdentifierPrefix)run.kan.s3mountain.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.kan.s3mountain.FileProvider
        PRODUCT_NAME: R2MountainFileProvider
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  R2Mountain:
    build:
      targets:
        R2Mountain: all
    run:
      config: Debug
