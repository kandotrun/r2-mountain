name: S3Mountain
options:
  bundleIdPrefix: run.kan
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ja
packages:
  MountainCore:
    path: Packages/MountainCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: UGNVGWZMAU
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    GENERATE_INFOPLIST_FILE: YES
targets:
  S3Mountain:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: MountainCore
      - target: S3MountainFileProvider
    entitlements:
      path: App/S3Mountain.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)run.kan.s3mountain
        keychain-access-groups:
          - $(AppIdentifierPrefix)run.kan.s3mountain.shared
        com.apple.developer.fileprovider.testing-mode: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.kan.s3mountain
        PRODUCT_NAME: S3 Mountain
        INFOPLIST_KEY_CFBundleDisplayName: S3 Mountain
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSMultipleInstancesProhibited: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
  S3MountainFileProvider:
    type: app-extension
    platform: macOS
    sources:
      - FileProvider
    dependencies:
      - package: MountainCore
    info:
      path: FileProvider/Info.plist
      properties:
        CFBundleDisplayName: S3 Mountain
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderDocumentGroup: $(TeamIdentifierPrefix)run.kan.s3mountain
    entitlements:
      path: FileProvider/FileProvider.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)run.kan.s3mountain
        keychain-access-groups:
          - $(AppIdentifierPrefix)run.kan.s3mountain.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.kan.s3mountain.FileProvider
        PRODUCT_NAME: S3MountainFileProvider
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  S3Mountain:
    build:
      targets:
        S3Mountain: all
    run:
      config: Debug
